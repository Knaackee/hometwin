name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m py_compile custom_components/hometwin/*.py
      - run: python tools/test-language-options.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: node build.mjs
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: built-panel
          path: custom_components/hometwin/frontend/
      - name: Built panel is committed and up to date
        run: |
          changes=$(git status --porcelain -- custom_components/hometwin/frontend library/index.json frontend/src/library.gen.js docs/demo/index.html)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Run 'cd frontend && npm ci && node build.mjs' and commit all generated files. The built-panel artifact contains the Linux CI output."
            exit 1
          fi
      - name: Build is unchanged with library-tool dependencies installed
        run: |
          npm ci
          npm run test:i18n
          node tools/test-media-geometry.mjs
          node tools/test-object-placement.mjs
          node tools/test-furniture-composition.mjs
          node tools/test-projector-split.mjs
          node tools/test-level-slabs.mjs
          node tools/test-house-geometry.mjs
          npm run build
          test -z "$(git status --porcelain -- custom_components/hometwin/frontend library/index.json frontend/src/library.gen.js docs/demo/index.html)"

  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Validate all objects
        run: npm run validate -- --strict
      - name: Render previews of changed objects
        id: previews
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          ids=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }} -- library | grep -E '/((object|recipe)\.json|review\.png)$' | xargs -r -n1 dirname | sed 's#^library/##' | sort -u)
          if [ -n "$ids" ]; then
            npm run preview -- $ids
            echo "rendered=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.previews.outputs.rendered == 'true'
        with:
          name: previews
          path: .preview/*-sheet.png
          include-hidden-files: true
          if-no-files-found: error
